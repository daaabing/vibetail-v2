# Minimal hand-written Supabase CLI config for the local test stack.
# This file was authored without `supabase init` (CLI unavailable at authoring
# time). It intentionally sticks to conservative, long-stable keys. If your CLI
# version reports an unknown or renamed key here, run `supabase init` in a
# scratch directory and align this file with its generated config.toml.
project_id = "vibetail"

[api]
enabled = true
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
# Relative to this directory. seed.sql is generated by scripts/generate-seed.mjs
# (gitignored); `pnpm db:reset` and the vitest globalSetup regenerate it.
sql_paths = ["./seed.sql"]

[storage]
enabled = true

# Auth stays enabled: storage validates requests via GoTrue-issued JWTs, and it
# is not certain the storage container works with auth disabled. Do not turn
# this off for speed without verifying storage still serves the private bucket.
[auth]
enabled = true

[auth.email]
enable_signup = true
# local_smtp is off below, so a confirmation link could never be read here.
# Production keeps confirmations on; the sign-up form handles the no-session case.
enable_confirmations = false

# To make the Google button complete locally: create the OAuth client per
# docs/operations/google-auth-setup.md, export the two env vars, uncomment,
# and restart the stack (pnpm db:stop && pnpm db:start).
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
# skip_nonce_check = true

# Everything below is disabled purely to speed up `supabase start` for tests.
[studio]
enabled = false

# CLI >= 2.x renamed [inbucket] to [local_smtp].
[local_smtp]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

# ---------------------------------------------------------------------------
# Remote overrides. NOTHING PUSHES THESE TODAY — `supabase config push` is not
# wired into CI, and `config push` has no --dry-run, so the first push must be
# rehearsed against a throwaway project rather than staging. Until then this
# block is reviewable documentation of what staging's settings should be.
#
# Everything above describes the local test stack. `config push` merges that
# base with the block below, so any local-only value that would be wrong on a
# hosted project has to be restated here — silence means the local value wins.
# ---------------------------------------------------------------------------
[remotes.staging]
project_id = "dzabqqybqmrjxxrmziyf"

[remotes.staging.auth]
# The base has no site_url, which would resolve to localhost and send every
# confirmation and OAuth redirect to a machine the merchant is not sitting at.
site_url = "https://vibetailweb-staging.up.railway.app"
additional_redirect_urls = ["https://vibetailweb-staging.up.railway.app/auth/callback"]

[remotes.staging.auth.email]
enable_signup = true
# Staging has no custom SMTP, and Supabase's built-in mailer only delivers to
# project team members at 2 messages/hour — so a required confirmation strands
# every other address. Turn this back on in the same change that configures a
# real SMTP provider.
enable_confirmations = false

[remotes.staging.db.seed]
# infra/supabase/seed.sql is generated test data for the local stack. `db push`
# already withholds seeds unless asked, and this keeps `config push` honest too.
enabled = false

# Re-enabled because the base disables all three purely to make `supabase start`
# faster for tests; a hosted project has no reason to lose them.
[remotes.staging.studio]
enabled = true

[remotes.staging.realtime]
enabled = true

[remotes.staging.analytics]
enabled = true

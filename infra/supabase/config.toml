# Minimal hand-written Supabase CLI config for the local test stack.
# This file was authored without `supabase init` (CLI unavailable at authoring
# time). It intentionally sticks to conservative, long-stable keys. If your CLI
# version reports an unknown or renamed key here, run `supabase init` in a
# scratch directory and align this file with its generated config.toml.
project_id = "vibetail"

[api]
enabled = true
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
# Relative to this directory. seed.sql is generated by scripts/generate-seed.mjs
# (gitignored); `pnpm db:reset` and the vitest globalSetup regenerate it.
sql_paths = ["./seed.sql"]

[storage]
enabled = true

# Auth stays enabled: storage validates requests via GoTrue-issued JWTs, and it
# is not certain the storage container works with auth disabled. Do not turn
# this off for speed without verifying storage still serves the private bucket.
[auth]
enabled = true

[auth.email]
enable_signup = true
# local_smtp is off below, so a confirmation link could never be read here;
# the sign-up form handles the no-session case.
enable_confirmations = false

# To make the Google button complete locally: create the OAuth client per
# docs/operations/google-auth-setup.md, export the two env vars, uncomment,
# and restart the stack (pnpm db:stop && pnpm db:start).
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
# skip_nonce_check = true

# Everything below is disabled purely to speed up `supabase start` for tests.
[studio]
enabled = false

# CLI >= 2.x renamed [inbucket] to [local_smtp].
[local_smtp]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

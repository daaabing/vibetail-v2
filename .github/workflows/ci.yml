name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Includes pulling/booting the local Supabase Docker stack before tests.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # All tests (unit + integration) require the local Supabase stack; the
      # vitest globalSetup only runs `db reset`, so start the stack explicitly.
      # ubuntu-latest ships with Docker preinstalled.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase --workdir infra start
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit:forbidden

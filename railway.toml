[build]
# Keep builds explicit so staging deploys the same production artifact verified in CI.
builder = "RAILPACK"
buildCommand = "pnpm build"
watchPatterns = ["/apps/**", "/packages/**", "/fixtures/**", "/package.json", "/pnpm-lock.yaml", "/pnpm-workspace.yaml", "/tsconfig*.json", "/railway.toml"]

[deploy]
startCommand = "node apps/web/dist/server/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 10
drainingSeconds = 20
